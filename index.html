<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIR CLUB — Thessaloniki</title>
  <meta name="description" content="NOIR CLUB Thessaloniki — Reserve your table.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="logo">NOIR</div>
    <a href="#reserve" class="nav-cta">RESERVE</a>
  </header>

  <main>
    <section class="hero" aria-label="NOIR CLUB">
      <div class="hero-track">
        <div class="hero-slide active">
          <video autoplay muted loop playsinline preload="auto">
            <source src="assets/videos/Κοριτσι.mp4" type="video/mp4">
          </video>
        </div>
        <div class="hero-slide">
          <img src="assets/images/χωρος%20κλαμπ.jpg" alt="NOIR CLUB interior">
        </div>
        <div class="hero-slide">
          <video autoplay muted loop playsinline preload="auto">
            <source src="assets/videos/Ποτο%20κλαμπ.mp4" type="video/mp4">
          </video>
        </div>
      </div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <p>THESSALONIKI</p>
        <h1>NOIR<br>CLUB</h1>
      </div>
      <button class="arrow prev" aria-label="Previous slide">‹</button>
      <button class="arrow next" aria-label="Next slide">›</button>
      <div class="dots" aria-label="Carousel navigation">
        <button class="dot active" aria-label="Slide 1"></button>
        <button class="dot" aria-label="Slide 2"></button>
        <button class="dot" aria-label="Slide 3"></button>
      </div>
    </section>

    <section id="reserve" class="reserve-section">
      <div class="eyebrow">THESSALONIKI • NIGHTLIFE</div>
      <h2>RESERVE<br>YOUR TABLE</h2>
      <p>Choose your night. Choose your table. We'll take care of the rest.</p>
      <button class="gold-button" type="button">START RESERVATION</button>
    </section>

    <section id="assistant" class="assistant-section">
      <div class="eyebrow">YOUR DIGITAL CONCIERGE</div>
      <h2>YOUR PERSONAL<br>ASSISTANT</h2>
      <p class="assistant-prompt">ASK ME A QUESTION</p>
      <div class="language-card">
        <span>SELECT LANGUAGE</span>
        <div class="language-buttons">
          <button type="button">ENGLISH</button>
          <button type="button">ΕΛΛΗΝΙΚΑ</button>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <strong>NOIR CLUB</strong>
    <span>THESSALONIKI</span>
    <small>Powered by ELåiVA — T&amp;S COMPANY</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
